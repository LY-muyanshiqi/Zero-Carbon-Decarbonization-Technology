<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1600, initial-scale=1.0">
<title>明日调度建议 · 零碳虚拟电厂</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root{
  --bg:#0a1628; --bg2:#0d2137; --bd:rgba(0,227,150,0.10);
  --gn:#00e396; --cy:#00b4d8; --wr:#f2a23a; --rd:#ef4444;
  --tx:#e2e8f0; --t2:#9ca3af; --t3:#5a7a8a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:0 20px 30px}

.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid var(--bd)}
.topbar .title{font-size:18px;font-weight:700;color:var(--gn);letter-spacing:3px;display:flex;align-items:center;gap:10px}
.topbar .title::before{content:'';width:7px;height:7px;background:var(--gn);border-radius:50%;animation:pulse 2s infinite;display:inline-block}
.topbar .right{font-size:12px;color:var(--t2)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}

.kpi-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.kpi-card{flex:1;min-width:150px;background:var(--bg2);border:1px solid var(--bd);padding:16px;border-radius:4px}
.kpi-card .lb{font-size:12px;color:var(--t3);margin-bottom:8px;letter-spacing:1px}
.kpi-card .v{font-size:32px;font-weight:700;color:var(--gn);font-family:'Consolas',monospace;line-height:1}
.kpi-card .u{font-size:13px;color:var(--t2);margin-left:3px}
.kpi-card.hl .v{color:var(--wr)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.panel{background:var(--bg2);border:1px solid var(--bd);padding:16px;border-radius:4px}
.panel.full{grid-column:1/-1}
.panel .hd{font-size:12px;color:var(--t3);letter-spacing:1.5px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.panel .hd::before{content:'';width:3px;height:12px;background:var(--gn);display:block;flex-shrink:0}
.chart{height:320px}

table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.04)}
th{color:var(--t3);font-weight:500}
td.num{font-family:'Consolas',monospace}
.badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px}
.badge.chg{background:rgba(0,180,216,0.15);color:var(--cy)}
.badge.dis{background:rgba(0,227,150,0.15);color:var(--gn)}
.badge.idle{background:rgba(255,255,255,0.05);color:var(--t3)}
.badge.safe{background:rgba(242,162,58,0.15);color:var(--wr)}
.badge.eco{background:rgba(0,227,150,0.15);color:var(--gn)}

.foot{margin-top:16px;font-size:11px;color:var(--t3);text-align:center}
</style>
</head>
<body>

<div class="topbar">
  <div class="title">明日调度建议</div>
  <div class="right" id="dateInfo">—</div>
</div>

<div class="kpi-row" id="kpiRow"></div>

<div class="grid">
  <div class="panel"><div class="hd">负荷 · 光伏 · 购电 逐时曲线 (kW)</div><div class="chart" id="cPower"></div></div>
  <div class="panel"><div class="hd">储能充放功率 (正=放电/负=充电) · 曝气下调 (kW) 与 SOC</div><div class="chart" id="cBattery"></div></div>
  <div class="panel full"><div class="hd">逐时操作指令明细</div><div id="tblWrap"></div></div>
</div>

<div class="foot">零碳虚拟电厂 · AI 智能调度平台 · 中山市中嘉污水处理厂示范</div>

(function(){
const d = DATA;
const s = d.summary, sr = d.series;
  document.getElementById('dateInfo').textContent =
    `目标日 ${s['目标日']} | 模式 ${s['运行模式']} | 曝气下限 ${s['曝气下限']}% | 光伏匹配 ${s['匹配相似日'].length}个相似日`;

  // KPI 卡片
  const m = d.metrics || {};
  const kpis = [
    {lb:'绿电占比', v:s['绿电占比_pct'], u:'%', hl:false},
    {lb:'外购电量', v:s['外购电量_kWh'].toLocaleString(), u:'kWh', hl:false},

      : `<span class="badge idle">无</span>`;
    return `<tr>
      <td>${h['小时']}</td>
      <td class="num">${h['预测负荷_kW']}</td>
      <td class="num">${h['预测光伏_kW']}</td>
      <td>${badge}</td>
      <td class="num">${h['购电_kW']}</td>
      <td class="num">${h['曝气下调_kW']}</td>

  }).join('');
  document.getElementById('tblWrap').innerHTML =
    `<table><thead><tr><th>时</th><th>负荷kW</th><th>光伏kW</th><th>储能动作</th><th>购电kW</th><th>曝气下调kW</th><th>光伏去向</th><th>实际用电kW</th><th>SOC</th></tr></thead><tbody>${rows}</tbody></table>`;

  window.addEventListener('resize',()=>{c1.resize();c2.resize();});
})();
</script>
</body>
</html>
